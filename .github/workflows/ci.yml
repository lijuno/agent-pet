name: CI

# The Go suite runs on macOS. The menu-bar item is Objective-C compiled through
# cgo and the window is Wails' WebKit view, so there is nothing to learn from a
# Linux runner that a compile error on macOS would not say first.
#
# The UI suite runs on Linux, because what it needs is a browser rather than a
# Mac. It is the same suite `make test-ui` opens in yours.
#
# What is still not covered is `make test-desktop`, which needs the app running
# and drives its menu bar. A green tick here does not mean a menu handler works
# — one shipped broken that way. See CLAUDE.md.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # The version go.mod declares, so the claimed minimum is actually
        # tested, and current stable, so a new toolchain cannot break the build
        # unnoticed.
        go: ["1.23.0", "stable"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # -race because the engine runs timers and subscribers on their own
      # goroutines; a data race there would otherwise surface as a pet that is
      # occasionally, unreproducibly wrong.
      - name: go test
        run: go test -race ./...

  # No Go, no Wails, no cache: this serves ui/dist/index.html to a headless
  # browser and reads the summary out of the page. It is the only automated
  # check the frontend has, which matters more than it used to — a session
  # working on this repository in the cloud cannot run the app at all.
  ui:
    name: the UI suite, headless
    runs-on: ubuntu-latest
    # The suite takes seconds. This is here because the first version of this
    # job hung: a headless Chrome that blocks on dbus never returns, and a
    # GitHub job with nothing to stop it runs for six hours before the platform
    # kills it. The script bounds the browser itself; this bounds the job.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The runner image ships Google Chrome; the script finds it on PATH, the
      # same way it finds a chromium on a developer's machine. If a future image
      # drops it, this fails saying exactly that rather than passing quietly.
      - name: make test-ui-headless
        run: make test-ui-headless

  build:
    name: build the app bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Pinned to the version go.mod requires. An older CLI fails on a recent
      # toolchain with `internal error: package "strings" without types`, which
      # does not look like a version problem — see the README.
      - name: install the Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      # `wails build` failing leaves any previous bundle in place, so the exit
      # code is not enough on a machine that has built before. The runner is
      # clean, but assert the bundle exists anyway: that is the check a person
      # would forget.
      # `make build` rather than `wails build`, so the universal flag and the
      # embedded petctl are covered too. A green run against a bundle missing
      # petctl would mean the plugin's shim has nothing to resolve.
      - name: make build
        run: make build

      # `wails build` failing leaves any previous bundle in place, so the exit
      # code is not enough on a machine that has built before. The runner is
      # clean, but assert the shape anyway: that is the check a person would
      # forget.
      - name: check the bundle
        run: |
          app=build/bin/agent-pet.app
          test -x $app/Contents/MacOS/petd
          test -x $app/Contents/MacOS/petctl
          for b in petd petctl; do
            archs=$(lipo -archs $app/Contents/MacOS/$b)
            case "$archs" in
              *x86_64*arm64*|*arm64*x86_64*) ;;
              *) echo "$b is '$archs', not universal — Intel users would get nothing"; exit 1 ;;
            esac
          done
          echo "built $(du -sh $app | cut -f1), both binaries universal"
