<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Digital Pet — UI tests</title>
<style>
  body {
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    margin: 0; padding: 24px; background: #16161a; color: #ececf1;
  }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .sub { color: #8a8a95; margin-bottom: 16px; font-size: 12px; }
  #summary { font-size: 14px; font-weight: 600; padding: 10px 12px; border-radius: 8px; margin-bottom: 14px; }
  .ok { background: rgba(80, 200, 120, .14); color: #7fe0a0; }
  .bad { background: rgba(255, 90, 90, .14); color: #ff9b9b; }
  .running { background: rgba(255,255,255,.07); color: #b9b9c4; }
  li { list-style: none; padding: 2px 0; }
  .pass::before { content: "✓ "; color: #7fe0a0; }
  .fail::before { content: "✗ "; color: #ff8080; }
  .fail { color: #ff9b9b; }
  .err { color: #ff9b9b; margin: 2px 0 8px 16px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
  ul { margin: 0; padding: 0; }
</style>
</head>
<body>
<h1>Digital Pet — UI tests</h1>
<div class="sub">
  Each test loads the real <code>ui/dist/index.html</code> in a fresh iframe.
  Serve the repository over http and open this file; <code>file://</code> will
  not work, because the tests need same-origin access to the frame.
</div>
<div id="summary" class="running">running…</div>
<ul id="results"></ul>

<script src="ui_test.js"></script>
<script>
(async () => {
  const list = document.getElementById("results");
  const summary = document.getElementById("summary");

  const out = await run((r) => {
    const li = document.createElement("li");
    li.className = r.ok ? "pass" : "fail";
    li.textContent = r.name;
    list.appendChild(li);
    if (!r.ok) {
      const e = document.createElement("div");
      e.className = "err";
      e.textContent = r.error;
      list.appendChild(e);
    }
  });

  summary.className = out.fail === 0 ? "ok" : "bad";
  summary.textContent = out.fail === 0
    ? `all ${out.total} tests passed`
    : `${out.fail} of ${out.total} tests failed`;

  // Read by the harness that runs this headlessly.
  window.__results = out;
  document.title = out.fail === 0
    ? `PASS ${out.pass}/${out.total}`
    : `FAIL ${out.fail}/${out.total}`;
})();
</script>
</body>
</html>
